<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faculty Signup</title>
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.png" type="image/png">
</head>
<body>
  <div class="main-shell">
    <div class="container-fluid px-0">
      <div class="row justify-content-center mx-0">
        <div class="col-12 col-sm-11 col-md-10 col-lg-7 col-xl-6 px-2 px-sm-3 px-md-4">
          <div class="login-container auth-card shadow-sm border-0 rounded-3 p-4 p-md-5">
            <div class="brand-wrap">
              <img src="logo.png" alt="Lab Equipment Tracker logo" class="img-fluid brand-logo">
            </div>
            <h2 class="text-center auth-title">Faculty Registration</h2>
            <p class="subtitle">Lab Equipment Management System</p>

            <form id="signupForm" onsubmit="return false" novalidate>

              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="facultyId" placeholder="Faculty ID" required>
                <label for="facultyId">Faculty ID</label>
              </div>

              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="name" placeholder="Faculty Name" required>
                <label for="name">Faculty Name</label>
              </div>

              <div class="form-floating mb-3">
                <select class="form-control" id="department" required>
                  <option value="" disabled selected>Select Department</option>
                  <option value="CSE">CSE</option>
                  <option value="Chemical">Chemical</option>
                  <option value="Mechanical">Mechanical</option>
                  <option value="ECE">ECE</option>
                  <option value="EEE">EEE</option>
                  <option value="Civil">Civil</option>
                </select>
                <label for="department">Department</label>
              </div>

              <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="name@bvrit.ac.in" required>
                <label for="email">Email (@bvrit.ac.in)</label>
              </div>

              <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <label for="password">Password</label>
              </div>

              <div class="form-floating mb-4">
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
                <label for="confirmPassword">Confirm Password</label>
              </div>

              <button id="signup-submit" class="btn btn-primary w-100 py-2" type="button">Register</button>

              <p class="switch text-center">
                Already registered? <a href="login.html">Login</a>
              </p>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="api-base.js"></script>
  <script>
    (function () {
      const API_BASE = window.API_BASE || window.location.origin;
      const submitBtn = document.getElementById("signup-submit");
      const form = document.getElementById("signupForm");

      function hasSpaces(str) {
        return /\s/.test(str);
      }

      function passwordMeetsRules(pwd) {
        const hasMin = pwd.length >= 5;
        const hasUpper = /[A-Z]/.test(pwd);
        const hasLower = /[a-z]/.test(pwd);
        const hasNumber = /[0-9]/.test(pwd);
        const hasSpecial = /[!@#$%^&*]/.test(pwd);
        return hasMin && hasUpper && hasLower && hasNumber && hasSpecial;
      }

      function usernameMeetsRules(name) {
        const hasMin = name.length >= 5;
        const allowedChars = /^[A-Za-z0-9._-]+$/.test(name);
        const startsWithLetter = /^[A-Za-z]/.test(name);
        return hasMin && allowedChars && startsWithLetter;
      }

      async function handleSignup() {
        const facultyId = document.getElementById("facultyId").value.trim();
        const name = document.getElementById("name").value.trim();
        const department = document.getElementById("department").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        // Department comes from dropdown; ensure selection
        if (!department) {
          alert("Please select a department.");
          return;
        }

        if (!facultyId || !name || !department || !email || !password || !confirmPassword) {
          alert("All fields are required");
          return;
        }
        if ([facultyId, name, department, email, password, confirmPassword].some(hasSpaces)) {
          alert("Spaces are not allowed in any field.");
          return;
        }
        if (!usernameMeetsRules(facultyId)) {
          alert("Faculty ID must start with a letter, be ≥5 characters, and only use letters, numbers, . _ -");
          return;
        }
        if (!passwordMeetsRules(password)) {
          alert("Password must be ≥5 chars and include uppercase, lowercase, number, and special (!@#$%^&*).");
          return;
        }
        if (password !== confirmPassword) {
          alert("Passwords do not match");
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = "Registering...";

          const registerResponse = await fetch(`${API_BASE}/api/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name,
              faculty_id: facultyId,
              department,
              email,
              password
            })
          });
          const registerPayload = await registerResponse.json();
          if (!registerResponse.ok || !registerPayload.success) {
            throw new Error(registerPayload?.error?.message || "Registration failed");
          }

          const loginResponse = await fetch(`${API_BASE}/api/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
          });
          const loginPayload = await loginResponse.json();
          if (!loginResponse.ok || !loginPayload.success || !loginPayload.data?.token) {
            throw new Error(loginPayload?.error?.message || "Login after registration failed");
          }

          const token = loginPayload.data.token;
          const userResponse = await fetch(`${API_BASE}/api/auth/me`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          const userPayload = await userResponse.json();
          if (!userResponse.ok || !userPayload.success) {
            throw new Error(userPayload?.error?.message || "Unable to load user");
          }

          const userId = userPayload.data.user.id;
          await fetch(`${API_BASE}/api/labs/assign`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({ user_id: userId, lab_name: department })
          });

          localStorage.setItem("auth_token", token);
          localStorage.setItem("user_email", email);
          localStorage.setItem("managed_lab", department);
          window.location.replace("/admin.html");
        } catch (err) {
          alert(err.message || "Unable to register");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Register";
        }
      }

      submitBtn.addEventListener("click", handleSignup);
      form.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          handleSignup();
        }
      });
    })();
  </script>

</body>
</html>
