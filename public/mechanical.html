<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body>
    <h1> <b> Prototyping Lab </b> </h1>
    <div id = "EquCount" > <b> EQUIPMENTS </b>

    <div id = "boxD"> <button data-page = wires.html> House Wires, Bulbs, Holders </button></div>

    <div id = "boxF"> <button data-page = welding.html> Welding Equipments </button></div>
    <hr>
    </div>

    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll("#EquCount button").forEach( button => {
            button.addEventListener("click", () => {
                window.location.href = button.dataset.page; 
            });
        });
    </script>

    <link rel = "stylesheet" href = "mechanical.css">

</html>
