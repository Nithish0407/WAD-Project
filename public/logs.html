<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Equipment Logs | BVRIT LabTrack</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="container-fluid p-0">
  <header class="topbar">
    <div class="logo">
      <i class="fa-solid fa-flask"></i>
      <span>BVRIT LabTrack</span>
    </div>
    <nav>
      <a href="admin.html" class="home-link">Back To Dashboard</a>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </nav>
  </header>

  <main class="content container-fluid px-3 px-md-4">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 col-xl-9">
        <h1>Equipment Logs</h1>
        <p id="logs-message"></p>

        <div class="table-box">
          <p class="session-meta" id="logs-meta">Loading equipment...</p>
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>When</th>
                  <th>Action</th>
                  <th>Status</th>
                  <th>Faculty</th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody id="logs-table-body">
                <tr><td colspan="5">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="api-base.js"></script>
  <script src="logs.js"></script>
</body>
</html>
