<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chemical Lab | Equipment</title>
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
      <h1 class="mb-0">Chemical Lab</h1>
    </div>

    <div class="row g-3">
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Beakers</h5>
            <button class="btn btn-primary w-100" data-page="beakers.html">Open</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Flasks</h5>
            <button class="btn btn-primary w-100" data-page="flasks.html">Open</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Test Tubes</h5>
            <button class="btn btn-primary w-100" data-page="testtubes.html">Open</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-lg-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Thermometers</h5>
            <button class="btn btn-primary w-100" data-page="thermometer.html">Open</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>
    document.querySelectorAll("button[data-page]").forEach(button => {
      button.addEventListener("click", () => {
        window.location.href = button.dataset.page;
      });
    });
  </script>
</body>
</html>
