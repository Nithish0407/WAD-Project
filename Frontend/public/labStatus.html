<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Status</title>
  <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .status-card {
      background: white;
      padding: 24px 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
    }
    .status {
      font-size: 20px;
      margin-top: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="status-card">
    <h2 class="mb-2">🧪 Lab Status</h2>
    <p id="students" class="mb-1 text-muted">Loading...</p>
    <div id="status" class="status text-primary">...</div>
  </div>

  <script>
    const API = "https://wad-project-l6pk.onrender.com";
    fetch(`${API}/lab-status`)
      .then(res => res.json())
      .then(data => {
        document.getElementById("students").innerText =
          "Required Students: " + (data.requiredStudents ?? "N/A");

        document.getElementById("status").innerText =
          data.status || "unknown";
      })
      .catch(err => {
        document.getElementById("status").innerText =
          "❌ Cannot fetch lab status";
      });
  </script>
  <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
